name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install system conversion tools
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg webp
      - name: Install Python TGS renderer
        run: python3 -m pip install --break-system-packages rlottie-python==1.3.8 Pillow==11.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
